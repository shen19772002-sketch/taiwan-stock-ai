name: Tests and static report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Keep the pinned Playwright version on its supported runner OS.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock -e .
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - name: Build truthful empty-state report without network
        run: |
          python -m taiwan_stock_ai run --offline --phase manual --data-dir data --output site
          python -m taiwan_stock_ai check-db --data-dir data
          test -s site/index.html
      - name: Install Chromium for PWA verification
        if: matrix.python == '3.12'
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Verify mobile PWA, offline reports and app updates
        if: matrix.python == '3.12'
        run: python scripts/pwa_smoke.py --site site --out pwa-evidence
      - name: Verify AI research cards, filters and preserved watchlists
        if: matrix.python == '3.12'
        run: python scripts/ai_ui_smoke.py --site site --out ai-evidence
      - name: Retain PWA verification evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-verification
          path: |
            pwa-evidence/
            ai-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: offline-report-python-${{ matrix.python }}
          path: site/
          retention-days: 7
