name: Daily Taiwan stock research

on:
  workflow_call:
    inputs:
      phase:
        description: Research phase supplied by a fixed manual entry point
        required: false
        default: manual
        type: string
      history_days:
        description: Optional historical warmup; normal manual entries keep zero
        required: false
        default: 0
        type: number
      probe_sources:
        description: Optional independent official API probe
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron uses UTC. Asia/Taipei is UTC+8 and has no daylight saving.
    # Phase follows the scheduled slot even if GitHub starts the runner late.
    # 08:20 preopen; 12:30 existing intraday availability check; 15:30 postclose;
    # 18:30 and 20:30 refresh officially published institutional data.
    - cron: '20 0 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '30 10 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Research phase (intraday has no live-price provider in V1)
        required: true
        default: manual
        type: choice
        options: [auto, preopen, intraday, postclose, final, manual]
      history_days:
        description: Initial official history backfill (0 skips; first run use 100 calendar days)
        required: false
        default: 0
        type: number
      probe_sources:
        description: Verify official API access from this runner (also on holidays)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TZ: Asia/Taipei
  PYTHONUNBUFFERED: '1'

# Never cancel a run while its persistent history is being written.
concurrency:
  group: taiwan-stock-research-and-history
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize diagnostics
        run: |
          mkdir -p run-logs
          date -u > run-logs/job-started.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: >-
          python scripts/run_research.py --label install --attempts 2 --timeout 300 --
          python -m pip install -r requirements.lock -e .
      - name: Resolve original scheduled trading session
        if: github.event_name == 'schedule'
        id: schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python scripts/run_research.py --label schedule --attempts 3 --timeout 60 --
          python scripts/research_schedule.py --schedule "$RESEARCH_SCHEDULE"
      - name: Restore permanent data branch
        id: restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/run_research.py --label restore --attempts 1 --timeout 600 --
          python scripts/persist_data.py restore
          --repository "$GITHUB_REPOSITORY"
          --state-dir "$RUNNER_TEMP/market-data-checkout"
          --data-dir data
      - name: Optional initial historical warmup
        env:
          HISTORY_DAYS: ${{ inputs.history_days || '0' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          days = int(os.environ['HISTORY_DAYS'])
          if not 0 <= days <= 120:
              raise SystemExit('history_days must be between 0 and 120')
          if days:
              end = datetime.now(ZoneInfo('Asia/Taipei')).date() - timedelta(days=1)
              subprocess.run([sys.executable, '-m', 'taiwan_stock_ai', 'backfill',
                              '--start', (end - timedelta(days=days - 1)).isoformat(),
                              '--end', end.isoformat(), '--data-dir', 'data'], check=True)
          PY
      - name: Probe official sources for manual validation
        if: ${{ inputs.probe_sources }}
        run: >-
          python scripts/run_research.py --label probe --attempts 2 --timeout 600 --
          python -m taiwan_stock_ai probe --data-dir data
      - name: Collect and generate research
        id: research
        env:
          RESEARCH_PHASE: ${{ inputs.phase || steps.schedule.outputs.phase || 'manual' }}
          RESEARCH_AS_OF: ${{ steps.schedule.outputs.as_of }}
        run: |
          date_args=()
          if [ -n "$RESEARCH_AS_OF" ]; then
            date_args=(--as-of "$RESEARCH_AS_OF")
          fi
          python scripts/run_research.py --label research --attempts 3 --timeout 600 -- \
            python -m taiwan_stock_ai run \
            --phase "$RESEARCH_PHASE" --data-dir data --output site "${date_args[@]}"
      - name: Verify database before archive
        run: >-
          python scripts/run_research.py --label integrity --attempts 1 --timeout 120 --
          python -m taiwan_stock_ai check-db --data-dir data
      - name: Save permanent research history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/run_research.py --label archive --attempts 3 --timeout 600 --
          python scripts/persist_data.py save
          --repository "$GITHUB_REPOSITORY"
          --state-dir "$RUNNER_TEMP/market-data-checkout"
          --data-dir data
      - name: Retain recovery artifact even if publication fails
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: research-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize command outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Research command results\n\n')
              summary.write('A successful command may report waiting for official data or a closed market.\n\n')
              summary.write('| Command | Attempts | Final exit code |\n| --- | ---: | ---: |\n')
              for path in sorted(Path('run-logs').glob('*.json')):
                  item = json.loads(path.read_text(encoding='utf-8'))
                  summary.write(f"| {item['label']} | {len(item['attempts'])} | {item.get('exit_code', 'interrupted')} |\n")
              summary.write('\nDownload the research-logs artifact for all attempt logs. '
                            'Setup failures also remain in this Actions run log.\n')
          PY
      - name: Retain diagnostics even when setup or restore fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-logs/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Downloadable research pages
        if: always() && steps.research.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: research-report-${{ github.run_id }}
          path: site/
          retention-days: 30

  deploy:
    needs: research
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
