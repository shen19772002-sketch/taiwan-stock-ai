[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-stock-ai"
version = "1.0.0"
description = "可驗證、可解釋的台股盤後投資研究系統"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "requests==2.32.5",
  "Jinja2==3.1.6",
  "plotly==6.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]
browser = ["playwright==1.55.0"]

[project.scripts]
taiwan-stock-ai = "taiwan_stock_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taiwan_stock_ai = ["templates/*.html", "static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
